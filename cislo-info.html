<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Informace o čísle | TKM</title><link rel="stylesheet" href="tkm-new.css"></head><body><div class="topbar">TKM - Telekomunikační modul telefonních čísel a hovorů</div><div class="container" style="max-width:1000px"><div class="card"><div class="card-header"><p>Informace o telefonním čísle</p><h1 id="numberTitle" style="margin:0;color:#0d47a1"></h1></div><div class="info-grid" id="infoGrid"></div></div><a class="back primary-back" id="backLink" href="index.html">← Na přehled hovorů a konverzací</a></div><script src="tkm-data.js"></script><script>
const D=window.TKM_DATA,q=new URLSearchParams(location.search),num=q.get('number'),back=q.get('back'),backNumber=q.get('backNumber'); const entry=Object.entries(D.contacts).find(([k,v])=>v.number===num); const c=entry&&entry[1];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
if(!c){document.getElementById('numberTitle').textContent=num||'Neznámé číslo';document.getElementById('infoGrid').innerHTML='<div class="info-box full"><small>Stav</small><strong>Informace nejsou dostupné.</strong></div>';}else{document.getElementById('numberTitle').textContent=c.number;document.getElementById('infoGrid').innerHTML=`<div class="info-box"><small>Operátor</small><strong>${esc(c.operator)}</strong></div><div class="info-box"><small>Typ</small><strong>${esc(c.type)}</strong></div><div class="info-box"><small>Aktivace</small><strong>${esc(c.activation)}</strong></div><div class="info-box"><small>Registrovaný uživatel</small><span class="person-status neutral">${esc(c.registered)}</span></div><div class="info-box full"><small>Jméno / označení</small><strong>${esc(c.name)}</strong></div><div class="info-box full"><small>Adresa evidovaná u operátora</small><strong>${esc(c.address)}</strong></div><div class="info-box full"><small>Poznámka</small><strong>${esc(c.note||'DOPLNIT')}</strong></div>`;}
const b=document.getElementById('backLink'); if(back){b.href=back;b.textContent='← Na přehled hovorů a konverzací telefonního čísla '+(backNumber||'');}
</script></body></html>
