<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konverzace SMS | TKM</title><link rel="stylesheet" href="tkm-new.css"><style>
.thread-wrap{max-width:940px}.thread-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}.thread-sub{color:#667085;margin-top:8px}.thread{padding:24px 26px 30px;display:flex;flex-direction:column;gap:14px}.sms-bubble{max-width:78%;border-radius:14px;padding:15px 17px;border:1px solid #dce3ed;box-shadow:0 2px 8px rgba(0,0,0,.05)}.sms-bubble.in{align-self:flex-start;background:#f7f9fc;border-left:5px solid #2e7d32}.sms-bubble.out{align-self:flex-end;background:#eef5ff;border-right:5px solid #0d47a1}.sms-top{display:flex;gap:12px;justify-content:space-between;align-items:center;font-size:13px;color:#667085;margin-bottom:9px}.sms-text{white-space:pre-line;font-size:18px;line-height:1.55}.sms-id{font-family:Consolas,monospace;color:#475467}.thread-numbers{font-weight:800;color:#0d47a1}.report-corner{position:fixed;right:20px;bottom:18px;z-index:20}.report-corner button{max-width:340px;background:#b71c1c;color:#fff;border:0;border-radius:9px;padding:13px 18px;box-shadow:0 3px 12px rgba(0,0,0,.28);font-weight:800;cursor:pointer}.result-note{display:none;margin:0 26px 24px;border-left:5px solid #b71c1c;background:#fff5f5;padding:14px 17px;border-radius:7px;font-weight:700}@media(max-width:620px){.sms-bubble{max-width:94%}.report-corner{left:14px;right:14px}.report-corner button{width:100%;max-width:none}}
</style></head><body><div class="topbar">TKM - Telekomunikační modul telefonních čísel a hovorů</div><div class="container thread-wrap">
<div class="card"><div class="card-header"><div class="thread-head"><div><p>SMS komunikace</p><h1 style="margin:0">Celá konverzace</h1><div class="thread-sub" id="threadNumbers"></div></div><span class="status restricted">Omezený režim</span></div></div><div class="thread" id="thread"></div><div class="result-note" id="resultNote"></div></div>
<a class="back primary-back" id="backLink" href="index.html">← Na přehled hovorů a konverzací</a></div>
<div class="report-corner"><button id="reportButton" type="button">Nahlásit podezřelou SMS</button></div>
<div class="modal-backdrop" id="normalModal"><div class="modal"><div class="modal-head">Vyhodnocení SMS</div><div class="modal-body">V této konverzaci nebyla nalezena SMS vyhodnocená jako podezřelá.</div><div class="modal-actions"><button class="modal-close" type="button">Zavřít</button></div></div></div>
<script src="tkm-data.js"></script><script>
const D=window.TKM_DATA, q=new URLSearchParams(location.search), owner=q.get('owner'), other=q.get('other'); const me=D.contacts[owner], them=D.contacts[other];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ts(x){const m=x.date.match(/(\d+)\.\s*(\d+)\.\s*(\d+)/); return new Date(+m[3],+m[2]-1,+m[1],...x.time.split(':').map(Number)).getTime();}
const thread=D.messages.filter(x=>(x.from===owner&&x.to===other)||(x.from===other&&x.to===owner)).sort((a,b)=>ts(a)-ts(b));
const box=document.getElementById('thread'); const nums=document.getElementById('threadNumbers'); const back=document.getElementById('backLink'); const report=document.getElementById('reportButton'); const normal=document.getElementById('normalModal');
if(!me||!them||!thread.length){box.innerHTML='<p>Konverzace nebyla nalezena.</p>'; report.style.display='none';}
else{const ownerFile=me.number.replace(/\s/g,'')+'.html';const infoHref=c=>c.main?`${c.infoFile}?back=${encodeURIComponent(ownerFile)}&backNumber=${encodeURIComponent(me.number)}`:`cislo-info.html?number=${encodeURIComponent(c.number)}&back=${encodeURIComponent(ownerFile)}&backNumber=${encodeURIComponent(me.number)}`;nums.innerHTML=`<a class="thread-numbers phone-link" href="${infoHref(me)}">${esc(me.number)}</a> ↔ <a class="thread-numbers phone-link" href="${infoHref(them)}">${esc(them.number)}</a>`; box.innerHTML=thread.map(x=>{const outgoing=x.from===owner; return `<div class="sms-bubble ${outgoing?'out':'in'}"><div class="sms-top"><span><strong>${outgoing?'Odchozí':'Příchozí'}</strong> · ${esc(x.date)}, ${esc(x.time)}</span><span class="sms-id">ID ${esc(x.recordId)}</span></div><div class="sms-text">${esc(x.text)}</div></div>`}).join(''); const file=me.number.replace(/\s/g,'')+'.html'; back.href=file; back.textContent='← Na přehled hovorů a konverzací telefonního čísla '+me.number;}
let armed=false; report.addEventListener('click',()=>{if(!thread.length)return; const suspicious=thread.some(x=>x.suspicious); if(!suspicious){normal.classList.add('open');return;} if(!armed){armed=true;report.textContent='LOKALIZOVAT osobu v době 21:30 a později toho dne';const note=document.getElementById('resultNote');note.style.display='block';note.textContent='V konverzaci byla nalezena podezřelá SMS. Je dostupná mimořádná lokalizace zařízení pro časové období po 21:30.';}else{const lm={SEBASTIAN:'M2',DAMIAN:'M4',TAMARA:'Z3',ELVIRA:'Z4'};location.href='lokalizace-swingers.html?osoba='+encodeURIComponent(lm[owner]||'M2');}}); normal.addEventListener('click',e=>{if(e.target===normal||e.target.classList.contains('modal-close'))normal.classList.remove('open')});
</script></body></html>
